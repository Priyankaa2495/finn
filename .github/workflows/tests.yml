name: tests
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (clean python:3.12-slim container, zero-key)
    runs-on: ubuntu-latest
    container: python:3.12-slim
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - run: pip install --no-cache-dir -r requirements-dev.txt
      # No LLM secret is configured: every path runs on deterministic rules.
      # Includes tests/test_eval.py: rules precision >= 95%, coverage >= 85%, 0 buried (dev + holdout).
      - run: python -m pytest -q
      - run: python scripts/eval_classify.py run --tag ci

  frontend:
    name: app.js syntax (script + ES module)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node --check frontend/app.js
      - run: cp frontend/app.js "$RUNNER_TEMP/app.mjs" && node --check "$RUNNER_TEMP/app.mjs"
      - run: node -e "JSON.parse(require('fs').readFileSync('frontend/manifest.json','utf8'))"

  docker:
    name: image builds and boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t finn:ci .
      - run: docker run -d --name finn -p 8000:8000 -e FINN_ACCESS_TOKEN=ci-token finn:ci
      - name: health, UI and auth smoke test
        run: |
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/api/health && break; sleep 2; done
          curl -fsS http://localhost:8000/api/health | grep -q '"ok":true'
          curl -fsS -o /dev/null http://localhost:8000/manifest.json
          curl -fsS -o /dev/null http://localhost:8000/favicon.ico
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/brief)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://localhost:8000/?key=ci-token')" = "303"
          test "$(docker inspect -f '{{.Config.User}}' finn)" = "finn"
      - if: always()
        run: docker logs finn || true
