name: tests
on:
  push:
    paths-ignore: ["backend/data/snapshot/**"]   # the daily data commit doesn't need a full run
  pull_request: {}
  workflow_dispatch: {}

jobs:
  unit:
    # A fresh runner has only what requirements.txt declares, so an import that works
    # only because it happens to be in someone's local venv fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - run: pip install -r backend/requirements.txt
      - name: pytest (no API key; every path must work without a model)
        working-directory: backend
        env: { GEMINI_API_KEY: "" }
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Frontend parses (pytest never loads app.js; a syntax error ships a blank page)
        run: cp frontend/app.js "$RUNNER_TEMP/app.mjs" && node --check "$RUNNER_TEMP/app.mjs"

  container:
    # Builds the exact image Render runs and checks it boots and passes the host health check
    # with the access gate ON — the configuration that would have failed on deploy.
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t finn .
      - name: Boot with access token and probe
        run: |
          docker run -d --name finn -p 8000:8000 -e FINN_ACCESS_TOKEN=ci-token finn
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/api/meta)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'x-finn-key: ci-token' localhost:8000/api/meta)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'x-finn-key: ci-token' localhost:8000/api/brief)" = 200
      - if: failure()
        run: docker logs finn
