name: refresh-market-data
on:
  schedule:
    - cron: "45 11 * * 1-5"    # 17:15 IST, after NSE close and most results filings
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r backend/requirements.txt
      - name: Fetch prices, filings, fundamentals and export snapshot
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m scripts.refresh --export
      - name: Commit snapshot (only public market data, never the network)
        run: |
          git config user.name "finn-bot"
          git config user.email "finn-bot@users.noreply.github.com"
          git add backend/data/snapshot
          git diff --cached --quiet || git commit -m "data: daily snapshot $(date -u +%F)"
          git push
