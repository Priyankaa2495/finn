services:
  - type: web
    name: finn
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true            # each snapshot commit from the refresh job redeploys
    envVars:
      - key: GEMINI_API_KEY      # optional; FINN runs fully without it
        sync: false
      - key: FINN_ACCESS_TOKEN   # share the app as https://<app>.onrender.com/?key=<token>
        sync: false
      - key: FINN_DEMO
        value: "1"
